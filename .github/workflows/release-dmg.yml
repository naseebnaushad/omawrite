name: Attach macOS DMG to release

on:
  release:
    types: [published]

jobs:
  dmg:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt

      - name: Build the DMG
        run: |
          export PATH="$(brew --prefix qt)/bin:$PATH"
          ./bin/dmg

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/Omawrite.dmg --repo "${{ github.repository }}"
