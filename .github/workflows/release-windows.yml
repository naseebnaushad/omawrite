name: Attach Windows build to release

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          arch: win64_msvc2022_64

      - name: Set up the MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run the tests
        shell: pwsh
        run: ./bin/test.ps1

      - name: Build the zip
        shell: pwsh
        run: ./bin/package.ps1

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omawrite-windows
          path: build/Omawrite-windows.zip

      - name: Upload to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/Omawrite-windows.zip --repo "${{ github.repository }}"